<h2 style="color: #1a1a1a; font-size: 22px; margin: 0 0 8px 0; font-weight: 700; line-height: 1.3;">Dobrý deň, {{CUSTOMER_NAME}}!</h2>
<p style="color: #555555; font-size: 15px; margin: 0 0 20px 0; line-height: 1.5;">Vaša rezervácia bola úspešne prijatá.</p>
<div style="height: 1px; background: #e0e0e0; margin: 20px 0;"></div>
<h3 style="color: #b8860b; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 12px 0; font-weight: 700;">Detaily rezervácie</h3>
<table style="width: 100%; border-collapse: collapse;">
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Dátum</div>
      <div style="color: #1a1a1a; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word;">{{DATE}}</div>
    </td>
  </tr>
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Čas</div>
      <div style="color: #1a1a1a; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word;">{{TIME}}</div>
    </td>
  </tr>
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Služba</div>
      <div style="color: #1a1a1a; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word;">{{SERVICE}}</div>
    </td>
  </tr>
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Trvanie</div>
      <div style="color: #1a1a1a; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word;">{{DURATION}} minút</div>
    </td>
  </tr>
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Barber</div>
      <div style="color: #1a1a1a; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word;">{{BARBER}}</div>
    </td>
  </tr>
  <tr>
    <td style="padding: 10px 0;">
      <div style="color: #555555; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">Cena</div>
      <div style="color: #b8860b; font-size: 22px; font-weight: 700;">{{PRICE}}€</div>
    </td>
  </tr>
</table>
{{CONTACT}}
<p style="color: #555555; font-size: 13px; margin: 20px 0 0 0; text-align: center; line-height: 1.5;">
  Tešíme sa na vás!
</p>
